info:
  name: Admin List All Banners
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/admin/banners"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Admin endpoint to list all hero banners (active and inactive) with metadata."
