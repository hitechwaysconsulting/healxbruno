info:
  name: Admin Login (Email + Password)
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/auth/admin/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{adminEmail}}",
        "password": "{{adminPassword}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "if (res.getStatus() === 200) {\r

        \  var json = res.getBody();\r

        \  if (json.accessToken) bru.setCollectionVar(\"adminToken\", json.accessToken);\r

        \  if (json.refreshToken) bru.setCollectionVar(\"refreshToken\", json.refreshToken);\r

        \  console.log(\"Admin Token Captured:\", json.accessToken);\r

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Authenticates an administrator with email and bcrypt password. Issues an Access Token and Refresh Token.
