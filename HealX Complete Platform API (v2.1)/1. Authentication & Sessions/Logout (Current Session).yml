info:
  name: Logout (Current Session)
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/auth/logout"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "refreshToken": "{{refreshToken}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Revokes the supplied refresh token session.
