info:
  name: Logout All Devices
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/auth/logout-all"
  headers:
    - name: Authorization
      value: Bearer {{customerToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Invalidates all active refresh tokens for the current actor across all browsers/devices.
