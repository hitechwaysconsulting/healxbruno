info:
  name: Clear Cart
  type: http
  seq: 6

http:
  method: DELETE
  url: "{{baseUrl}}/cart"
  headers:
    - name: Authorization
      value: Bearer {{customerToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Removes all items from the active cart.
