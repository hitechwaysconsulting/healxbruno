info:
  name: Get Active Cart
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/cart"
  headers:
    - name: Authorization
      value: Bearer {{customerToken}}
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "if (res.getStatus() === 200) {\r

        \  var json = res.getBody();\r

        \  if (json.items && json.items.length > 0) {\r

        \    bru.setCollectionVar(\"cartItemId\", json.items[0].id);\r

        \  }\r

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Fetches current customer's active cart with itemized breakdown, discounts, platform fee, taxes, and final total.
