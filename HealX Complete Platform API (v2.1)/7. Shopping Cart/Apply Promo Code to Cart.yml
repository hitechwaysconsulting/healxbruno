info:
  name: Apply Promo Code to Cart
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{baseUrl}}/cart"
  headers:
    - name: Authorization
      value: Bearer {{customerToken}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "promo_code": "WELCOME50"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Applies a discount code to the cart. Pass promo_code: null to remove."
