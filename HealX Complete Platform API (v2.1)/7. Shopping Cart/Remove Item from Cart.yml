info:
  name: Remove Item from Cart
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{baseUrl}}/cart/items/{{cartItemId}}"
  headers:
    - name: Authorization
      value: Bearer {{customerToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Deletes a service item from the cart.
