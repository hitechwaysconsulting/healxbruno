info:
  name: Admin Get Role Permissions
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/admin/roles/{{roleId}}/permissions"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Fetches full granular permission matrix for the specified role across all system modules."
