info:
  name: Admin Reset Admin Password
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/admin/admins/{{targetAdminId}}/reset-password"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "new_password": "BrandNewSecurePassword123#"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Resets the password for a specific administrator account and revokes existing active sessions."
