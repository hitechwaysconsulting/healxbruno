info:
  name: Admin List Promo Codes
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/admin/promo-codes?status=active&page=1&limit=50"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  params:
    - name: status
      value: active
      type: query
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "50"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Lists all promo codes with current redemption counts, total discount amounts given, and validity dates.
