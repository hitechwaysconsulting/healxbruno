info:
  name: Admin Get Promo Code Usage History
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/admin/promo-codes/{{promoCodeId}}/usage"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Audit trail of every customer and order that redeemed this coupon.
