info:
  name: List Saved Addresses
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/user/addresses"
  headers:
    - name: Authorization
      value: Bearer {{customerToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Lists all saved delivery addresses for the logged-in customer or partner, sorted with default first.
