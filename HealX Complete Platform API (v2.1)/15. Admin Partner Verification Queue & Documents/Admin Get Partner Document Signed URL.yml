info:
  name: Admin Get Partner Document Signed URL
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/admin/partner-applications/{{applicationId}}/documents/{{docType}}/signed-url?expires_in=900"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  params:
    - name: expires_in
      value: "900"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Generates secure pre-signed Cloudflare R2 download URL for applicant verification documents (docType: aadhaar, pan, cert, driving_license). Audit logged as PARTNER_DOCUMENT_VIEWED."
