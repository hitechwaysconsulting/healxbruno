info:
  name: Admin Get Prescription Signed URL
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/admin/prescriptions/{{prescriptionId}}/signed-url?expires_in=900"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  params:
    - name: expires_in
      value: "900"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Generates secure pre-signed Cloudflare R2 download URL for a prescription file by its prescription record UUID. Audit logged as PRESCRIPTION_VIEWED with actor and IP tracking."
