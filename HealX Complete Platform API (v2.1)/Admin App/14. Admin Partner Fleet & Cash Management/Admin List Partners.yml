info:
  name: Admin List Partners
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/admin/partners?status=active&category=nurse&zone_id=1"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  params:
    - name: status
      value: active
      type: query
    - name: category
      value: nurse
      type: query
    - name: zone_id
      value: "1"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Lists registered healthcare partners with performance rating, work type, status, zone_id, zone_name, and floating cash balance. Supports filter by zone_id."
