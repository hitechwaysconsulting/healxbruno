info:
  name: Reveal Bank Details (Audited Decryption)
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/admin/partner-applications/{{applicationId}}/bank-details"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Compliance endpoint: decrypts and reveals unmasked bank account number. Mandatory audit log entry (PARTNER_BANK_DETAILS_REVEALED) is ALWAYS written."
