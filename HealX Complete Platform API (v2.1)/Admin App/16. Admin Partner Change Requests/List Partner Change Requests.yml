info:
  name: List Partner Change Requests
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/admin/partner-change-requests?status=pending&request_type=zone&page=1&limit=20"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  params:
    - name: status
      value: pending
      type: query
      description: pending, approved, denied, all
    - name: request_type
      value: zone
      type: query
      description: zone, work_type
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "20"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "if (res.getStatus() === 200) {\r

        \  var json = res.getBody();\r

        \  if (json.requests && json.requests.length > 0) {\r

        \    bru.setCollectionVar(\"changeRequestId\", json.requests[0].id);\r

        \  }\r

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Lists partner change requests with 30-day lock expiration timestamps and requested values.
