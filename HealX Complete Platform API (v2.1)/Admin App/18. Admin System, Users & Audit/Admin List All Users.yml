info:
  name: Admin List All Users
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/admin/users?page=1&limit=50"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "50"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Unified view across Customers, Partners, and Admins. Aliases: GET /users."
