http:
  method: GET
  url: "{{baseUrl}}/logins"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Chronological log of customer, partner, and admin sign-ins.
