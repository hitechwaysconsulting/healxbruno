info:
  name: Admin Debug View OTPs
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/otps"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Inspects currently active, non-expired OTP codes for development testing.
