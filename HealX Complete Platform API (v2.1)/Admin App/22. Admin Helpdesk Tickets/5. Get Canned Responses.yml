info:
  name: 5. Get Canned Responses
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/admin/tickets/canned-responses?category_id=1"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  params:
    - name: category_id
      value: "1"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Returns pre-written canned responses for quick support agent replies."
