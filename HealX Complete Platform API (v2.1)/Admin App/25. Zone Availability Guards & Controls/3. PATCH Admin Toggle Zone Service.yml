info:
  name: "PATCH Admin Toggle Zone Service"
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/zones/{{testZoneId}}/services/{{testServiceId}}"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "enabled": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Admin endpoint to enable or disable a specific service for an operational zone."
