info:
  name: Admin List Roles
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/admin/roles"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Lists all defined RBAC roles with their descriptions, created dates, and computed active admin user counts."
