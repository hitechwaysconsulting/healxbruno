info:
  name: Admin Get Permission Overrides
  type: http
  seq: 11

http:
  method: GET
  url: "{{baseUrl}}/admin/admins/{{targetAdminId}}/permission-overrides"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Retrieves user-specific permission overrides that supplement or supersede role-level permissions for this admin."
