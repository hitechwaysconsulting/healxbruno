info:
  name: Admin Get Promo Code by ID
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/admin/promo-codes/{{promoCodeId}}"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Detailed analytics on a specific promo code.
