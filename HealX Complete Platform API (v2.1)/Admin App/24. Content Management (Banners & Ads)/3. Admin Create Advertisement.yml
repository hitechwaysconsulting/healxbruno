info:
  name: Admin Create Advertisement
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/admin/advertisements"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  body:
    type: multipart-form
    data:
      - name: advertiser_name
        value: "Pharma Partner X"
        type: text
      - name: image
        value: []
        type: file
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Uploads promotional advertisement creative to R2 bucket 'content-banners' with advertiser sponsor details."
