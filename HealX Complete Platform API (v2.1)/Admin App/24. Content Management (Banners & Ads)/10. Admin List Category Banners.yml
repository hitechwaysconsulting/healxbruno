info:
  name: Admin List Category Banners
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/admin/category-banners"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Admin endpoint to list all category banners."
