info:
  name: List Admin Bookings
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/admin/bookings?status=all&page=1&limit=20"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  params:
    - name: status
      value: all
      type: query
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "20"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Comprehensive admin overview of all bookings with multi-filter support.
