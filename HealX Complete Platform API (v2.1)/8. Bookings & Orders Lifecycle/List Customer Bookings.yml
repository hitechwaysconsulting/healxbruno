info:
  name: List Customer Bookings
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/user/bookings?status=all&page=1&limit=20"
  headers:
    - name: Authorization
      value: Bearer {{customerToken}}
  params:
    - name: status
      value: all
      type: query
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "20"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Customer's booking history with service name, assigned partner info, status, and OTPs.
