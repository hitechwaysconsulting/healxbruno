info:
  name: Get Booking Details
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/bookings/{{bookingId}}"
  headers:
    - name: Authorization
      value: Bearer {{customerToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Full booking detail view: address, timeline events, partner, prescription, review, and slot visits."
