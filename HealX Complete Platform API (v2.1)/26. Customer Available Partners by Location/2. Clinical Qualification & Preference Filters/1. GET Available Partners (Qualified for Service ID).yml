info:
  name: "GET /partners/by-location (Qualified for Specific Service ID)"
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/partners/by-location?lat=12.9716&lng=77.6412&service_id={{testServiceId}}"
  params:
    - name: lat
      value: "12.9716"
      type: query
    - name: lng
      value: "77.6412"
      type: query
    - name: service_id
      value: "{{testServiceId}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Ensures only clinicians qualified for the selected medical service are displayed."
