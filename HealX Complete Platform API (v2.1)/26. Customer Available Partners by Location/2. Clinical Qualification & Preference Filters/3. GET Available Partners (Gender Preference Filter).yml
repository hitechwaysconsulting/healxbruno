info:
  name: "GET /partners/by-location (Gender Preference Filter)"
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/partners/by-location?lat=12.9716&lng=77.6412&gender=female"
  params:
    - name: lat
      value: "12.9716"
      type: query
    - name: lng
      value: "77.6412"
      type: query
    - name: gender
      value: "female"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Allows patients to filter for healthcare professionals by gender preference (female, male, or other)."
