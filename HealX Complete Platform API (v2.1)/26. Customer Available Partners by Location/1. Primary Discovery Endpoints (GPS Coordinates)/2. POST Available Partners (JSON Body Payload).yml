info:
  name: "POST /partners/by-location (JSON Body Payload)"
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/partners/by-location"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "latitude": 12.9716,
        "longitude": 77.6412,
        "online_only": true,
        "sort": "rating_desc"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Alternative POST endpoint for clients preferring request body payloads."
