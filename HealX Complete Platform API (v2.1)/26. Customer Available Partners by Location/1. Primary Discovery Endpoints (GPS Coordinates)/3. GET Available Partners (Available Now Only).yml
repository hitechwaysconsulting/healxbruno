  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/partners/by-location?lat=12.9716&lng=77.6412&available_only=true"
  params:
    - name: lat
      value: "12.9716"
      type: query
    - name: lng
      value: "77.6412"
      type: query
