info:
  name: "GET /partners/by-location (Direct Zone ID Lookup)"
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/partners/by-location?zone_id={{testZoneId}}"
  params:
    - name: zone_id
      value: "{{testZoneId}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Direct query by operational zone ID."
