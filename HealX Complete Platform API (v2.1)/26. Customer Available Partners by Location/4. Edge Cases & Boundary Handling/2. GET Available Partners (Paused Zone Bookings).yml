info:
  name: "GET /partners/by-location (Paused Zone Bookings)"
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/partners/by-location?lat=12.9698&lng=77.7500"
  params:
    - name: lat
      value: "12.9698"
      type: query
    - name: lng
      value: "77.7500"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Returns is_serviceable: false when zone partner capacity is reached or bookings paused."
