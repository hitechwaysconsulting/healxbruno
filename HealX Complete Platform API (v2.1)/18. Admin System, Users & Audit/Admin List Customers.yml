info:
  name: Admin List Customers
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/admin/customers?page=1&limit=50"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "50"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Customer roster with booking count, registration date, and contact information. Aliases: GET /customers."
