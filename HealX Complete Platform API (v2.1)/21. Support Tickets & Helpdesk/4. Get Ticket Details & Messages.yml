info:
  name: 4. Get Ticket Details & Messages
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/tickets/{{ticketId}}"
  headers:
    - name: Authorization
      value: Bearer {{customerToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Retrieves complete ticket metadata and the entire chronological message thread."
