info:
  name: 3. List My Tickets
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/tickets?status=open&page=1&limit=20"
  headers:
    - name: Authorization
      value: Bearer {{customerToken}}
  params:
    - name: status
      value: open
      type: query
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "20"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Returns all tickets created by the authenticated customer or partner, with latest message snippet and category info. status: open | in_progress | resolved | closed."
