info:
  name: Delete Profile Image
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{baseUrl}}/user/profile/image"
  headers:
    - name: Authorization
      value: Bearer {{customerToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Removes avatar image from actor's profile.
