info:
  name: Get Profile
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/user/profile"
  headers:
    - name: Authorization
      value: Bearer {{customerToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Fetches current profile for customer or partner, including primary default address.
