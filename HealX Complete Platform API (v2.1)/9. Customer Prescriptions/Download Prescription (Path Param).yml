info:
  name: Download Prescription (Path Param)
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/user/prescriptions/{{prescriptionFileKey}}/download"
  headers:
    - name: Authorization
      value: Bearer {{customerToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Downloads prescription using file_key path parameter."
