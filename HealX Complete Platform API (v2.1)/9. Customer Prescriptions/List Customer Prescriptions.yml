info:
  name: List Customer Prescriptions
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/user/prescriptions"
  headers:
    - name: Authorization
      value: Bearer {{customerToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Lists all prescriptions uploaded by the logged-in customer.
