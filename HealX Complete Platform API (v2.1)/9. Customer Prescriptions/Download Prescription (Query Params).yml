info:
  name: Download Prescription (Query Params)
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/user/prescriptions/download?customer_id={{customerId}}&file_key={{prescriptionFileKey}}"
  headers:
    - name: Authorization
      value: Bearer {{customerToken}}
  params:
    - name: customer_id
      value: "{{customerId}}"
      type: query
    - name: file_key
      value: "{{prescriptionFileKey}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Downloads prescription PDF/image using customer_id and file_key query parameters."
