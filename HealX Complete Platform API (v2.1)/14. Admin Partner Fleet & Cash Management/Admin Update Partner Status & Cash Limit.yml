info:
  name: Admin Update Partner Status & Cash Limit
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{baseUrl}}/admin/partners/{{partnerId}}"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "status": "active",
        "floating_cash_limit": 7500,
        "zone_id": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Modifies partner status (active, suspended, deactivated), customizes floating cash limit, and reassigns operational zone_id."
