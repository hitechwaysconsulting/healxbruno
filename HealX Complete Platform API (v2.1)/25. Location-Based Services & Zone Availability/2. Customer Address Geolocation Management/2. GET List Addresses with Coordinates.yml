info:
  name: "GET List Addresses with Coordinates"
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/user/addresses"
  headers:
    - name: Authorization
      value: Bearer {{customerToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Retrieves customer addresses, including parsed latitude and longitude."
