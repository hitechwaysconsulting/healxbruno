info:
  name: "PUT Update Address Coordinates"
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/user/addresses/{{testAddressId}}"
  headers:
    - name: Authorization
      value: Bearer {{customerToken}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "latitude": 12.9725,
        "longitude": 77.6420
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Updates the latitude and longitude pin of an existing address."
