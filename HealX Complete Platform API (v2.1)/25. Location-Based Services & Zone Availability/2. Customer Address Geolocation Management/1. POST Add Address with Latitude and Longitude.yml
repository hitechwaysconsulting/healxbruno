info:
  name: "POST Add Address with Latitude & Longitude"
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/user/addresses"
  headers:
    - name: Authorization
      value: Bearer {{customerToken}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "address_line1": "Flat 401, Palm Meadows",
        "address_line2": "Tower 2",
        "landmark": "Near Forum Mall",
        "city_id": 1,
        "state_id": 1,
        "pincode": "560038",
        "latitude": 12.9716,
        "longitude": 77.6412,
        "label": "Home",
        "is_default": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Saves a new customer address with PostGIS geography point."
