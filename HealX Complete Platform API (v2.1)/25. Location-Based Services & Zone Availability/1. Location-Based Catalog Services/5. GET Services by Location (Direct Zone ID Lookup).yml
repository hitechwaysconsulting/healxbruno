info:
  name: "GET Services by Location (Direct Zone ID Lookup)"
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/services/by-location?zone_id={{testZoneId}}"
  params:
    - name: zone_id
      value: "{{testZoneId}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Fetches available services for an already resolved zone ID."
