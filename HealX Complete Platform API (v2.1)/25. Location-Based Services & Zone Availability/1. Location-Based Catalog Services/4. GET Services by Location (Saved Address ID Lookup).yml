info:
  name: "GET Services by Location (Saved Address ID Lookup)"
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/services/by-location?address_id={{testAddressId}}"
  headers:
    - name: Authorization
      value: Bearer {{customerToken}}
  params:
    - name: address_id
      value: "{{testAddressId}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Resolves zone and available services from a customer's saved address ID."
