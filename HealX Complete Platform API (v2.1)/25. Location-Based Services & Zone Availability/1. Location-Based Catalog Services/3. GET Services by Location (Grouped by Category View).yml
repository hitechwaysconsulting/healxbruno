info:
  name: "GET Services by Location (Grouped by Category View - Home Screen)"
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/services/by-location?lat=12.9716&lng=77.6412&grouped=true"
  params:
    - name: lat
      value: "12.9716"
      type: query
    - name: lng
      value: "77.6412"
      type: query
    - name: grouped
      value: "true"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Returns services nested inside active categories, suitable for home screen catalog layouts."
