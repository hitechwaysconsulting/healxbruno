info:
  name: "POST Create Booking with Zone Guard"
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/bookings"
  headers:
    - name: Authorization
      value: Bearer {{customerToken}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "service_id": "{{testServiceId}}",
        "address_id": "{{testAddressId}}",
        "scheduled_at": "2026-09-30T10:00:00Z",
        "payment_method": "cash_on_delivery",
        "order_type": "immediate"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Validates that requested services are enabled in the resolved zone before booking placement."
