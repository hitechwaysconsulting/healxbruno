info:
  name: "Get Services by Location (GPS & Geofencing)"
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/services/by-location?lat=12.9716&lng=77.6412&page=1&limit=20"
  params:
    - name: lat
      value: "12.9716"
      type: query
    - name: lng
      value: "77.6412"
      type: query
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "20"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Resolves customer operational zone via PostGIS GPS coordinates (or address_id / zone_id) and returns active catalog services."
