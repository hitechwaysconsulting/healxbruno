info:
  name: List Services (All / Filtered)
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/services?category=0&status=active&limit=20"
  params:
    - name: category
      value: "0"
      type: query
      description: "0: Medicated, 1: Non-Medicated"
    - name: status
      value: active
      type: query
    - name: limit
      value: "20"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "if (res.getStatus() === 200) {\r

        \  var json = res.getBody();\r

        \  if (Array.isArray(json) && json.length > 0) {\r

        \    bru.setCollectionVar(\"serviceId\", json[0].id);\r

        \    var med = json.find(s => s.category === 0 || s.prescription_mandatory);\r

        \    if (med) bru.setCollectionVar(\"medServiceId\", med.id);\r

        \  }\r

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Public catalog endpoint to browse services with pricing, duration, and prescription requirements.
