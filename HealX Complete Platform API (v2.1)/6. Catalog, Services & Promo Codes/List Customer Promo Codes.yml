info:
  name: List Customer Promo Codes
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/promo-codes?category=0&order_value=1500"
  headers:
    - name: Authorization
      value: Bearer {{customerToken}}
  params:
    - name: category
      value: "0"
      type: query
    - name: order_value
      value: "1500"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Lists active promo codes visible to customers. Authenticated requests check user per-limit and first-order eligibility.
