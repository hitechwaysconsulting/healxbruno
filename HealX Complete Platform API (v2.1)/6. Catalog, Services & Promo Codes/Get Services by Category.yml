info:
  name: Get Services by Category
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/categories/{{categorySlug}}/services"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Lists active services catalog under a specific category slug (e.g. nursing, elderly-care)."
