opencollection: 1.0.0

info:
  name: HealX Complete Platform API (v2.1)

request:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: customerToken
      value: ""
    - name: partnerToken
      value: ""
    - name: adminToken
      value: ""
    - name: adminEmail
      value: admin@healx.com
    - name: adminPassword
      value: Admin@12345
    - name: testCustomerPhone
      value: "+919876543210"
    - name: testCustomerEmail
      value: patient@healx.com
    - name: applicationId
      value: ""
    - name: changeRequestId
      value: ""
    - name: serviceId
      value: ""
    - name: medServiceId
      value: ""
    - name: cartItemId
      value: ""
    - name: addressId
      value: ""
    - name: familyMemberId
      value: ""
    - name: bookingId
      value: ""
    - name: visitId
      value: ""
    - name: partnerId
      value: ""
    - name: customerId
      value: ""
    - name: stateId
      value: "1"
    - name: cityId
      value: "1"
    - name: zoneId
      value: "1"
    - name: promoCodeId
      value: ""
    - name: promoCode
      value: WELCOME50
    - name: refundId
      value: ""
    - name: refreshToken
      value: ""
    - name: startOtp
      value: ""
    - name: completionOtp
      value: ""

docs:
  content: "Exhaustive Postman Collection covering all 130+ endpoint instances across the HealX Healthcare Platform: Auth, Customer, Partner, Admin, Catalog, Bookings, Cart, Zones, Partner Verification Queue, Document Review, Change Requests, Cash Ledger, Refunds, and System Utilities. Includes dynamic variable extraction (tokens, IDs, OTPs) and realistic payloads."
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
