info:
  name: Admin Get Suggested Partners for Visit
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/admin/bookings/{{bookingId}}/visits/{{visitId}}/suggested-partners"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Suggests matching partners based on zone proximity, category specialization, and current availability.
