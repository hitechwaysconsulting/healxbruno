info:
  name: Admin Get Service by ID
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/admin/services/{{serviceId}}"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Detailed service inspection for admins.
