info:
  name: Admin Delete Service
  type: http
  seq: 6

http:
  method: DELETE
  url: "{{baseUrl}}/admin/services/{{serviceId}}"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Soft deletes or removes service from active catalog.
