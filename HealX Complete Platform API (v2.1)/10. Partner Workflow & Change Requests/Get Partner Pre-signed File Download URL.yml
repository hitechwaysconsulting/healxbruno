info:
  name: Get Partner Pre-signed File Download URL
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/partner/files/signed-url?file_key={{fileKey}}&file_type=document"
  headers:
    - name: Authorization
      value: Bearer {{partnerToken}}
  params:
    - name: file_key
      value: "{{fileKey}}"
      type: query
    - name: file_type
      value: document
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Generates secure time-limited presigned S3/R2 download URL for partner verification documents, service prescriptions, or customer details. Aliases: GET /partners/files/signed-url."
