info:
  name: Update State (Admin)
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/states/{{stateId}}"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Karnataka (South)"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Admin renames state.
