info:
  name: Update City (Admin)
  type: http
  seq: 10

http:
  method: PATCH
  url: "{{baseUrl}}/cities/{{cityId}}"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Bengaluru Urban"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Admin updates city details.
