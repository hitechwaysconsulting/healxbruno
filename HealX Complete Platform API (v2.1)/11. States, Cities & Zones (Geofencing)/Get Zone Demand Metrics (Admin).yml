info:
  name: Get Zone Demand Metrics (Admin)
  type: http
  seq: 20

http:
  method: GET
  url: "{{baseUrl}}/zones/{{zoneId}}/demand"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Calculates real-time demand, active bookings, partner supply, and utilization percentage.
