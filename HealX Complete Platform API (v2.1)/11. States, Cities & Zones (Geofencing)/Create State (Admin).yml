info:
  name: Create State (Admin)
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/states"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Telangana"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Admin creates a new state entry.
