info:
  name: Get Zone Services Availability (Admin)
  type: http
  seq: 21

http:
  method: GET
  url: "{{baseUrl}}/zones/{{zoneId}}/services"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Lists which services are enabled or disabled within this specific geographic zone.
