info:
  name: List Family Members
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/user/family-members"
  headers:
    - name: Authorization
      value: Bearer {{customerToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Lists all family member profiles linked to the customer account.
