info:
  name: Update Family Member
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/user/family-members/{{familyMemberId}}"
  headers:
    - name: Authorization
      value: Bearer {{customerToken}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Shyam Sundar Sharma",
        "relationship": "Father",
        "age": 69,
        "allergies": "Penicillin",
        "weight": "72 kg"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Updates dependent member medical and personal information.
