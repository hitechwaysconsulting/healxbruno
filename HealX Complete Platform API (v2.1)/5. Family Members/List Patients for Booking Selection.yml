info:
  name: List Patients for Booking Selection
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/user/patients"
  headers:
    - name: Authorization
      value: Bearer {{customerToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Returns a consolidated list of patient profiles (the primary customer account plus all family members) formatted for checkout and booking patient selection."
