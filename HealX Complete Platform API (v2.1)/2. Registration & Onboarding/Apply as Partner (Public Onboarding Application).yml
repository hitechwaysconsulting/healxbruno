info:
  name: Apply as Partner (Public Onboarding Application)
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/auth/apply-partner"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Deepak Verma",
        "phone": "+919761909201",
        "email": "deepak.verma@example.com",
        "work_type": "full_time",
        "category": "nurse",
        "zone_id": 1,
        "selfie_url": "https://images.unsplash.com/photo-1537368910025-700350fe46c7?w=400",
        "selfie_match_score": 95.5,
        "bank_account_no": "9876543210987",
        "bank_ifsc": "HDFC0001234",
        "bank_account_name": "Deepak Verma",
        "gender": "male",
        "dob": "1991-04-18",
        "emergency_contact": "+919876543290",
        "documents": [
          {
            "doc_type": "aadhaar",
            "file_url": "https://example.com/docs/aadhaar_front_back.pdf"
          },
          {
            "doc_type": "pan",
            "file_url": "https://example.com/docs/pan_card.pdf"
          },
          {
            "doc_type": "certification",
            "file_url": "https://example.com/docs/nursing_bsc_degree.pdf"
          }
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "if (res.getStatus() === 201) {\r

        \  var json = res.getBody();\r

        \  if (json.application && json.application.id) {\r

        \    bru.setCollectionVar(\"applicationId\", json.application.id);\r

        \  }\r

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Prospective partner submits onboarding registration. Bank account number is encrypted with AES-256-CBC at rest. Aliases: POST /partner/apply, POST /partners/apply."
